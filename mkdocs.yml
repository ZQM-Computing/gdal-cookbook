site_name: GDAL Patterns
site_url: https://gdal.zqmlabs.com/
site_description: Runnable GDAL/OGR recipes for raster and vector conversion, reprojection, clipping, mosaics, metadata inspection, and repeatable geospatial data processing.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/gdal-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - meta
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
